<div>
    <form (submit)="$event.preventDefault(); handleAddTask();">
        <input type="text" [formField]="newTaskForm.title"/>

        <button>ajouter</button>
    </form>

    <div>
        @for(error of newTaskForm.title().errors(); track error.kind) {
            <p>{{ error.message }}</p>
        }

        @if(newTaskForm.title().invalid()) {
            <p>Problème sur title</p>
        }
    </div>

    @for(t of toto; track $index) {
        <p>{{ t }}</p>
    }
</div>
